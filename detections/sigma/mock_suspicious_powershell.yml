title: Mock Suspicious PowerShell Bypass
id: mock-gunnchai3k-powershell-bypass
status: experimental
description: Mock portfolio Sigma rule — requires analyst validation before operational use.
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\powershell.exe'
    CommandLine|contains:
      - 'ExecutionPolicy Bypass'
  condition: selection
tags:
  - mock
  - portfolio
  - attack.execution
falsepositives:
  - Legitimate admin scripts in production (not applicable to mock lab)
level: medium
