name: AI-USER-READY-002 market packet

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'stream/ai-user-ready-002-fast-research']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-user-ready-002-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  market-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: User-ready unit tests (no Fast download required)
        run: npm run test:user-ready
        env:
          GUNNCHAI_SKIP_FAST_DOWNLOAD: "1"
      - name: CLI packet with Fast download + llama.cpp if available
        continue-on-error: true
        env:
          GUNNCHAI_FAST_NETWORK_CONSENT: "1"
        run: |
          set -euo pipefail
          if ! command -v llama-cli >/dev/null 2>&1; then
            echo "llama-cli missing on guest — attempting a shallow llama.cpp build"
            git clone --depth 1 https://github.com/ggml-org/llama.cpp .llama-cpp-src || true
            if [ -d .llama-cpp-src ]; then
              cmake -S .llama-cpp-src -B .llama-cpp-src/build -DGGML_NATIVE=OFF || true
              cmake --build .llama-cpp-src/build --target llama-cli -j 2 || true
              if [ -x .llama-cpp-src/build/bin/llama-cli ]; then
                echo "$PWD/.llama-cpp-src/build/bin" >> "$GITHUB_PATH"
                export PATH="$PWD/.llama-cpp-src/build/bin:$PATH"
              fi
            fi
          fi
          npm run user-ready:002
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-user-ready-002-result
          path: artifacts/user-ready/AI_USER_READY_002_RESULT.json
          if-no-files-found: error
          retention-days: 14
