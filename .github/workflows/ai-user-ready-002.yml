name: AI-USER-READY-002 market packet

on:
  pull_request:
    branches:
      - main
      - integration/kirby-controlled-stack-main-reconciliation
  push:
    branches:
      - main
      - 'stream/ai-user-ready-002-fast-research'
      - 'stream/ai-user-ready-003-research-vision-coding'
      - integration/pr54-llamacpp-cli-compat-closure
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-user-ready-002-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  market-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install tesseract OCR (required by shared user-ready vision tests / AI-UR-011)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          tesseract --version
      - run: npm ci
      - name: User-ready unit tests (no Fast download required)
        run: npm run test:user-ready
        env:
          GUNNCHAI_SKIP_FAST_DOWNLOAD: "1"
      - name: Provision llama.cpp (llama-cli + llama-completion for tip CLI compat)
        run: |
          set -euo pipefail
          if command -v llama-cli >/dev/null 2>&1 && command -v llama-completion >/dev/null 2>&1; then
            echo "llama binaries on PATH: $(command -v llama-cli) $(command -v llama-completion)"
            llama-cli --version || true
            llama-completion --version || true
            exit 0
          fi
          git clone --depth 1 https://github.com/ggml-org/llama.cpp .llama-cpp-src
          echo "llama.cpp tip: $(git -C .llama-cpp-src rev-parse HEAD)"
          cmake -S .llama-cpp-src -B .llama-cpp-src/build -DGGML_NATIVE=OFF
          cmake --build .llama-cpp-src/build --target llama-cli llama-completion -j "$(nproc)"
          echo "$PWD/.llama-cpp-src/build/bin" >> "$GITHUB_PATH"
          test -x .llama-cpp-src/build/bin/llama-cli
          test -x .llama-cpp-src/build/bin/llama-completion
          .llama-cpp-src/build/bin/llama-cli --version || true
          .llama-cpp-src/build/bin/llama-completion --version || true
          .llama-cpp-src/build/bin/llama-cli --help > /tmp/llama-cli-help.txt 2>&1 || true
          .llama-cpp-src/build/bin/llama-completion --help > /tmp/llama-completion-help.txt 2>&1 || true
          echo "llama-cli -no-cnv in help: $(grep -c -- '-no-cnv' /tmp/llama-cli-help.txt || true)"
          echo "llama-completion -no-cnv in help: $(grep -c -- '-no-cnv' /tmp/llama-completion-help.txt || true)"
      - name: CLI packet 002 with Fast download + llama.cpp
        env:
          GUNNCHAI_FAST_NETWORK_CONSENT: "1"
        run: npm run user-ready:002
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-user-ready-002-result
          path: artifacts/user-ready/AI_USER_READY_002_RESULT.json
          if-no-files-found: error
          retention-days: 14
