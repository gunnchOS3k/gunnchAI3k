name: open-draft-reconcile-pr
on:
  push:
    branches:
      - integration/kirby-controlled-stack-main-reconciliation
jobs:
  open-draft-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create draft PR if absent
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = 'integration/kirby-controlled-stack-main-reconciliation';
            const base = 'main';
            const existing = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${head}`, base
            });
            if (existing.data.length) {
              core.info(`PR already exists: ${existing.data[0].html_url}`);
              return;
            }
            const body = [
              '## Summary',
              '- Clean merge of Kirby/provider bake-off + live-provider promotion + Nearby Edge stack (`aa61e92`) onto accepted main (`4f46c8f` / PR #50).',
              '- No conflicts (`ort`); preserved security/fallback/resource guards and WAIKE nearby-edge contracts.',
              '- Post-merge revalidation: core proof unit, bake-off, live promotion, controlled integration, Kirby Jest 36/36 — all PASS.',
              '- Nearby Edge physical journey **PASS** (Pixel 6a → ADB reverse → Nearby Mac → pair/exec/provenance/cancel-retry/offline honesty). On-device local and production-default claims remain **false**.',
              '',
              '## Candidate for Agent B',
              '- Branch tip: `' + context.sha + '`',
              '- Artifact: `artifacts/post_merge_reconcile/GUNNCHAI_FINAL_RECONCILIATION.json`',
              '',
              '## Test plan',
              '- [x] `npm run test:kirby-controlled` (36/36)',
              '- [x] `npm run proof:unit` (49/49)',
              '- [x] bakeoff:kirby / live promotion / controlled integration scripts',
              '- [x] Physical Pixel Nearby Edge journey evidence under `artifacts/kirby_v2/controlled_integration/pixel_journey/`',
              '- [ ] Human review of draft only — **DO NOT MERGE** until Agent B WAIKE pin + closure gates',
            ].join('\n');
            const pr = await github.rest.pulls.create({
              owner,
              repo,
              title: 'Reconcile controlled Kirby/Nearby Edge stack onto accepted main',
              head,
              base,
              draft: true,
              body,
            });
            core.info(`Created draft PR: ${pr.data.html_url}`);
